name: Release Precheck

# Reusable production-release gate, invoked as
#   uses: Danyanadamu/Workflows/.github/workflows/release-precheck.yml@v1
# Closes the classic release footguns before any image is built:
#   1. a tag that is not strict SemVer (vMAJOR.MINOR.PATCH),
#   2. a tag undocumented in CHANGELOG.md,
#   3. a tag whose signature does not verify against the repo's own
#      .allowed_signers (covers unsigned and lightweight tags),
#   4. a tag cut from a commit that never landed on the production branch.
# Public repository holding ZERO secrets by design: verification uses only
# the caller's checkout content.
on:
  workflow_call:
    inputs:
      base_branch:
        description: Production branch the tag must descend from
        type: string
        required: false
        default: main
      tag:
        description: Tag to verify (defaults to the triggering ref name)
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-24.04
    # Cheap verification job; anything hung here must fail fast, not eat
    # runner minutes while a release waits on it.
    timeout-minutes: 10
    steps:
      - name: Checkout full history with tags
        # Full history: tag verification and ancestry resolution reach
        # every ref, not just a shallow clone of the tagged commit.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Verify release tag
        env:
          BASE: ${{ inputs.base_branch }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # 1. Strict SemVer: prerelease and metadata suffixes never ship.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not strict SemVer (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          # 2. Documented: an undocumented tag halts the pipeline.
          if ! grep -Fq "## [$TAG]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$TAG]' section"
            exit 1
          fi
          # 3. Cryptographically verified against the repository's own
          #    signers file; unsigned, lightweight, or unknown-key tags
          #    fail here before anything ships.
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile .allowed_signers
          # actions/checkout@v4 rewrites the triggering tag ref to point at
          # the peeled commit (+<sha>:refs/tags/<tag>), which discards the
          # annotated tag object, so `git tag -v` would verify a plain
          # commit and abort. Force re-fetch the ref from origin so the
          # check runs against the signed annotated tag object.
          git fetch --force --quiet origin "+refs/tags/$TAG:refs/tags/$TAG"
          git tag -v "$TAG"
          # 4. Annotated-tag ancestry: peel the tag to its commit and
          #    demand it already be merged into the production branch.
          commit="$(git rev-list -n1 "$TAG")"
          git fetch --quiet origin "$BASE"
          if ! git merge-base --is-ancestor "$commit" "origin/$BASE"; then
            echo "::error::Tag '$TAG' ($commit) does not descend from origin/$BASE"
            exit 1
          fi
          echo "precheck OK: '$TAG' ($commit) is SemVer, documented, signed, and descends from origin/$BASE"
