name: Container Build

# Reusable GHCR image build, invoked as
#   uses: Danyanadamu/Workflows/.github/workflows/container-build.yml@v1
# One canonical build path for every repository: lowercase name
# normalization, GHA layer cache, provenance + SBOM attestations, Trivy
# severity gate on pushed refs, and a Sigstore-signed build-provenance
# attestation the deploy job verifies before anything touches a host.
# Public repository holding ZERO secrets by design: only the implicit
# GITHUB_TOKEN is used.
on:
  workflow_call:
    inputs:
      context:
        description: Build context directory
        type: string
        required: true
      file:
        description: Containerfile/Dockerfile path
        type: string
        required: true
      image_tag:
        description: Primary tag (commit sha for builds, ref_name for releases)
        type: string
        required: true
      extra_tags:
        description: Extra tag NAMES, one per line (no registry/image prefix)
        type: string
        required: false
        default: ''
      build_args:
        description: Build args, one KEY=VALUE per line
        type: string
        required: false
        default: ''
      push:
        description: Push to GHCR (false for PR verification builds)
        type: boolean
        required: false
        default: true
      scan_severity:
        description: Trivy severity gate for pushed refs
        type: string
        required: false
        default: CRITICAL
    outputs:
      image_ref:
        description: Pushed image reference (ghcr.io/name:primary-tag)
        value: ${{ jobs.build.outputs.image_ref }}
      image_digest:
        description: Pushed image digest (sha256:...) — the attestable subject
        value: ${{ jobs.build.outputs.image_digest }}

# The calling job's permissions are authoritative; declared here so the
# contract is visible in the catalog and can only be downgraded upstream.
# NOTE: the Sigstore provenance attestation deliberately does NOT run
# here — `id-token` cannot be granted to a reusable workflow's job
# (GitHub hard limitation: the OIDC grant never propagates past the
# `uses:` boundary). Callers run their own `attest` job after `build`
# with id-token: write + attestations: write, signing the digest this
# workflow returns via the `image_digest` output.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image_ref: ${{ steps.record.outputs.image_ref }}
      image_digest: ${{ steps.pushbuild.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Expand image tags
        env:
          PRIMARY_TAG: ${{ inputs.image_tag }}
          EXTRA_TAGS: ${{ inputs.extra_tags }}
        run: |
          set -euo pipefail
          # GHCR rejects uppercase path segments; github.repository keeps
          # the original mixed-case owner/name spelling, so normalize once
          # and expand every requested tag onto the canonical name.
          image_name="${GITHUB_REPOSITORY,,}"
          {
            echo "IMAGE_NAME=${image_name}"
            echo "IMAGE_REF=ghcr.io/${image_name}:${PRIMARY_TAG}"
            echo "IMAGE_TAGS<<TAGS_EOF"
            echo "ghcr.io/${image_name}:${PRIMARY_TAG}"
            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "ghcr.io/${image_name}:${tag}"
            done <<< "$EXTRA_TAGS"
            echo "TAGS_EOF"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        # The default docker-driver builder cannot export the GHA cache
        # or produce provenance/SBOM attestations; the container-driver
        # builder created here can, and buildx is preinstalled anyway.
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        id: pushbuild
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: ${{ inputs.push }}
          # Attestations ride only on pushed refs: PR verification builds
          # neither push nor load, and buildx rejects provenance there.
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}
          sbom: ${{ inputs.push }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ inputs.build_args }}
          tags: ${{ env.IMAGE_TAGS }}

      - name: Vulnerability scan (Trivy)
        # Only pushed refs are gated: a PR build produces no artifact, so
        # there is nothing to block. The scan necessarily runs after the
        # push (the ref must exist to be scanned), so a red scan means the
        # image sits in GHCR but is never deployed — staging rollouts and
        # production releases both require this job green.
        if: inputs.push
        env:
          TRIVY_VERSION: '0.76.2'
          SEVERITY: ${{ inputs.scan_severity }}
        run: |
          set -euo pipefail
          # The layer cache rides on cache-to: type=gha, so the local buildx
          # cache is dead weight once the push is done. Drop it before the
          # scan: hosted runners run out of disk otherwise (trivy unpacks its
          # DBs on top of the build residue) and the prune cannot happen after
          # a failed build step — this gate is the last consumer of the cache.
          docker buildx prune --all --force
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz trivy
          # No --skip-java-db-update here: trivy hard-fails the very first
          # scan on a cold runner when the flag is set ("the first run cannot
          # skip downloading the Java DB"), and every hosted runner is cold.
          # The prune above is what buys the disk headroom the Java DB needs;
          # --ignore-unfixed keeps the gate signal clean regardless.
          ./trivy image --exit-code 1 --ignore-unfixed --severity "$SEVERITY" "$IMAGE_REF"

      - name: Full vulnerability report (artifact)
        # The CRITICAL-only gate deliberately stays narrow (unfixable HIGH
        # findings must not freeze releases), but the full picture still
        # has to be reachable without re-running anything: this report
        # carries every severity including unfixed findings, parked as a
        # short-retention artifact next to the build for audit use.
        if: inputs.push
        env:
          TRIVY_VERSION: '0.76.2'
        run: |
          set -euo pipefail
          ./trivy image \
            --format json \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --output trivy-report.json \
            "$IMAGE_REF"
          findings=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-report.json)
          echo "trivy full report: $findings finding(s) across all severities"

      - name: Upload full vulnerability report
        if: inputs.push
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report-${{ inputs.image_tag }}
          path: trivy-report.json
          retention-days: 30

      - name: Record pushed image ref
        id: record
        run: echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
